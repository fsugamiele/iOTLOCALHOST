

volumes:
  vol-emqx-data:
    name: foo-emqx-data
  vol-emqx-log:
    name: foo-emqx-log


services:

  node:
    container_name: node
    image: "node:14"
    env_file:
     - .env
    restart: always
    working_dir: /home/node/app
    volumes:
      - ./app/:/home/node/app
      # DEC-REF-99: la API del simulador requiere el catálogo de escenarios
      # (fuente única) desde ../../../tools/device_simulator/lib/. Read-only.
      - ./tools/device_simulator/lib:/home/node/tools/device_simulator/lib:ro
    ports:
      - "3000:3000"
      - "3001:3001"
      - "80:3002"

    depends_on:
      mongo:
        condition: service_healthy
      emqx:
        condition: service_healthy

    command: sh -c "npm run start"

  mongo:
    container_name: mongo
    image: mongo:4.4
    restart: always
    logging:
      driver: "none"
    environment:
      TZ: "${TZ}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - ./mongodata:/data/db
    ports:
      - ${MONGO_EXT_PORT}:27017
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx:
    container_name: emqx
    image: emqx/emqx:4.2.3
    restart: always

    ports:
      - 18083:18083
      - 1883:1883
      - 8083:8083
      - 8085:8081

    volumes:
      - vol-emqx-data:/opt/emqx/data
      - vol-emqx-log:/opt/emqx/log

    links:
      - mongo

    extra_hosts:
      - "localhost:127.0.0.1"

    healthcheck:
      test: ["CMD-SHELL", "/opt/emqx/bin/emqx_ctl status | grep -q 'is running'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1

      TZ: "${TZ}"

      # DEFAULT DASH PASS
      EMQX_DASHBOARD__DEFAULT_USER__PASSWORD: "${EMQX_NODE_SUPERUSER_USER}"

      # DEFAULT APP SECRET
      EMQX_MANAGEMENT__DEFAULT_APPLICATION__SECRET: "${EMQX_NODE_SUPERUSER_PASSWORD}"

      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_NOMATCH: "deny"

      # MONGO CONNECTION
      EMQX_AUTH__MONGO__TYPE: single
      EMQX_AUTH__MONGO__TOPOLOGY__POOL_SIZE: 1
      EMQX_AUTH__MONGO__TOPOLOGY__MAX_OVERFLOW: 0

      EMQX_AUTH__MONGO__SERVER: "mongo:${MONGO_EXT_PORT}"
      EMQX_AUTH__MONGO__POOL: 8

      EMQX_AUTH__MONGO__LOGIN: "${MONGO_USERNAME}"
      EMQX_AUTH__MONGO__PASSWORD: "${MONGO_PASSWORD}"
      EMQX_AUTH__MONGO__AUTH_SOURCE: admin

      EMQX_AUTH__MONGO__DATABASE: "iotix"
      EMQX_AUTH__MONGO__AUTH_QUERY__COLLECTION: "emqxauthrules"

      EMQX_AUTH__MONGO__SUPER_QUERY__COLLECTION: "emqxauthrules"
      EMQX_AUTH__MONGO__SUPER_QUERY__SUPER_FIELD: "is_superuser"
      EMQX_AUTH__MONGO__SUPER_QUERY__SELECTOR: "username=%u"
      EMQX_AUTH__MONGO__SUPER_QUERY: "off"

      EMQX_AUTH__MONGO__AUTH_QUERY__PASSWORD_HASH: sha256
      EMQX_AUTH__MONGO__AUTH_QUERY__PASSWORD_FIELD: "password"
      EMQX_AUTH__MONGO__AUTH_QUERY__SELECTOR: "username=%u"

      ## Enable ACL query.
      #Access control list
      EMQX_AUTH__MONGO__ACL_QUERY: "on"
      EMQX_AUTH__MONGO__ACL_QUERY__COLLECTION: "emqxauthrules"
      EMQX_AUTH__MONGO__ACL_QUERY__SELECTOR: "username=%u"

      EMQX_LOADED_PLUGINS: "emqx_recon,emqx_retainer,emqx_management,emqx_dashboard,emqx_auth_mongo"

      EMQX_LISTENER__TCP__EXTERNAL__MAX_CONNECTIONS: 1000

  # DEC-REF-68 (b) — arranque autónomo del edge, crash-only.
  # Guardián: `restart: always` (NUNCA `on-failure:N` — se rendiría tras N).
  # `depends_on: service_healthy` cierra la carrera SOLO en `compose up`; en
  # reinicios por política y en reboot del host, el que cierra la carrera es
  # el fast-fail 5s de mongoose.connect + los handlers globales del código
  # (DEC-REF-68 pata c). En este contenedor el edge resuelve a sus vecinos
  # por hostname de servicio (`mongo`, `emqx`) — cero deriva localhost.
  wanomi-edge:
    container_name: wanomi-edge
    image: "node:14"
    restart: always

    env_file:
      - ./edge-engine/.env.edge

    environment:
      # Node busca modules desde la ubicación del script hacia arriba;
      # edge-engine/ no tiene node_modules propio y las libs viven en app/.
      NODE_PATH: /home/edge/app/node_modules

    working_dir: /home/edge/app

    volumes:
      # Bind del repo entero equivalente al servicio `node`. El edge
      # `require('../app/api/models/rule_pack')` desde edge-engine/, así que
      # ambos árboles tienen que coexistir en el mismo layout que en el host.
      - ./app/:/home/edge/app
      - ./edge-engine/:/home/edge/edge-engine
      # Preserva log per-site (DEC-REF-64.e). `tee -a` en el command duplica
      # a stdout para que `docker logs wanomi-edge` también sirva.
      - ./logs/:/home/edge/logs

    depends_on:
      mongo:
        condition: service_healthy
      emqx:
        condition: service_healthy

    # `set -o pipefail` (bash-only, por eso bash y no sh) propaga el exit del
    # node por el pipe → `restart: always` dispara ante cualquier muerte del
    # edge, no ante fallo aislado de `tee`. `$${SITE_ID}` escapa la
    # interpolación de compose y deja que bash del container la resuelva
    # desde el env_file (que ya lo tiene con valor CR00061).
    command: >
      bash -c "set -o pipefail;
      node /home/edge/edge-engine/index.js 2>&1
      | tee -a /home/edge/logs/edge-$${SITE_ID}.log"

  # DEC-REF-109 (#81) — simulador CONTENERIZADO (reversa DEC-STRAT-5).
  # El sim deja de ser proceso de host (supervisor.sh lanzado a mano por
  # apertura.sh) y pasa a servicio con `restart: always`, para auto-recuperarse
  # tras un corte de luz igual que el resto del stack. Era la ÚNICA pieza fuera
  # del auto-arranque: los 4 contenedores vuelven solos, el sim quedaba caído y
  # dejaba los sitios offline por horas (DEC-REF-105/#79, reincidente 21 y 22/09).
  wanomi-sim:
    container_name: wanomi-sim
    image: "node:14"
    restart: always

    working_dir: /home/sim

    environment:
      # Resuelve a sus vecinos por hostname de servicio (cero deriva localhost).
      # MQTT por TCP 1883 (NO 8083 = WebSocket). API (node) para el bootstrap de
      # credenciales de cada device.
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      API_HOST: node
      API_PORT: 3001

    volumes:
      # Autocontenido: tools/device_simulator trae su propio node_modules
      # (mqtt + deps). app/.env solo-lectura para que supervisor.sh grepee las
      # credenciales TEST_USER (NUNCA sourcear el archivo — MQTT_PORT ahí es WS).
      - ./tools:/home/sim/tools
      - ./app/.env:/home/sim/app/.env:ro
      - ./logs:/home/sim/logs

    depends_on:
      mongo:
        condition: service_healthy
      emqx:
        condition: service_healthy

    # supervisor.sh (PID1) mapea credenciales, setea SIMULATOR_MODE y corre
    # run.js con backoff. Dos capas de resiliencia: crash de run.js → supervisor
    # lo relanza en el acto (sin ciclo de contenedor); muerte del supervisor/
    # contenedor → `restart: always`; reboot del host → el daemon lo levanta con
    # el resto del stack. Sin `| tee` a propósito: el pipe dejaba a run.js
    # huérfano manteniendo abierto el fd y PID1 no salía limpio. Log = `docker
    # logs wanomi-sim`.
    command: bash tools/device_simulator/supervisor.sh

